<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SmallTV-Ultra: Weather + 5-Waqt Prayer Times (240x240)</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #111215;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Geist Sans", "Segoe UI", Roboto, sans-serif;
      color: #ffffff;
      padding: 24px;
    }
    .preview-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }
    .device-bezel {
      width: 290px;
      height: 290px;
      background: #1d1e22;
      border-radius: 24px;
      padding: 25px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.75), inset 0 1px 2px rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    .device-bezel::after {
      content: "GEEKMAGIC SMALLTV-ULTRA";
      position: absolute;
      bottom: 8px;
      font-size: 7.5px;
      letter-spacing: 1.5px;
      color: #636674;
      font-weight: 700;
    }

    /* Exact 240x240 ST7789 IPS Physical Screen */
    .screen-canvas {
      width: 240px;
      height: 240px;
      background-color: #0a0b0d;
      border-radius: 3px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      padding: 8px 10px 8px;
      position: relative;
      border: 1px solid rgba(255, 255, 255, 0.05);
      box-shadow: inset 0 0 12px rgba(0,0,0,0.9);
      justify-content: space-between;
    }

    /* 1. Header: City Location + Online indicator */
    .header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 2px;
    }
    .header-city {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -0.01em;
      color: #ffffff;
      line-height: 1;
    }
    .header-status {
      display: flex;
      align-items: center;
      gap: 3px;
    }
    .status-dot {
      width: 4.5px;
      height: 4.5px;
      background: #10b981;
      border-radius: 50%;
      box-shadow: 0 0 4px #10b981;
    }
    .status-text {
      font-size: 8.5px;
      font-weight: 600;
      color: #64748b;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    /* 2. Hero: Weather Graphic (Left) + Time / Date (Right) */
    .hero-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 1px 0 3px;
      padding: 0 2px;
    }
    .hero-weather-icon {
      width: 62px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .hero-time-col {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      line-height: 1.05;
    }
    .time-digits {
      font-size: 29px;
      font-weight: 800;
      color: #f59e0b; /* Golden Yellow */
      letter-spacing: -0.03em;
      font-feature-settings: "tnum";
      font-variant-numeric: tabular-nums;
    }
    .date-row {
      display: flex;
      gap: 5px;
      font-size: 12px;
      font-weight: 600;
      margin-top: 2px;
    }
    .date-str {
      color: #38bdf8; /* Cyan */
    }
    .day-str {
      color: #94a3b8; /* Slate */
    }

    /* 3. Islamic Prayer Times: 5-Waqt Horizontal Bento Grid */
    .prayer-strip-container {
      margin: 2px 0 4px;
    }
    .prayer-strip-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      font-size: 8px;
      color: #64748b;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 0 1px 2px;
    }
    .prayer-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 3px;
      background: rgba(255, 255, 255, 0.02);
      border-radius: 5px;
      padding: 3px;
      border: 1px solid rgba(255, 255, 255, 0.06);
    }
    .prayer-cell {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2.5px 1px;
      border-radius: 3px;
      background: #121419;
      border: 1px solid rgba(255, 255, 255, 0.04);
      transition: all 0.2s;
    }
    .prayer-cell.is-next {
      background: #1e1b13;
      border-color: #f59e0b;
      box-shadow: 0 0 6px rgba(245, 158, 11, 0.25);
    }
    .prayer-name {
      font-size: 7.5px;
      font-weight: 700;
      letter-spacing: 0.04em;
      color: #94a3b8;
      text-transform: uppercase;
      line-height: 1;
    }
    .prayer-cell.is-next .prayer-name {
      color: #f59e0b;
    }
    .prayer-time {
      font-size: 9.5px;
      font-weight: 700;
      color: #e2e8f0;
      font-family: ui-monospace, SFMono-Regular, "SF Mono", monospace;
      margin-top: 2px;
      line-height: 1;
    }
    .prayer-cell.is-next .prayer-time {
      color: #fef08a;
    }

    /* 4. Weather Condition Banner */
    .condition-banner {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12.5px;
      font-weight: 600;
      color: #f8fafc;
      padding: 2px 2px 3px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      margin-bottom: 3px;
    }
    .condition-text {
      color: #f1f5f9;
      letter-spacing: 0.01em;
    }
    .condition-temp {
      color: #fde047;
      font-weight: 700;
      font-size: 13px;
    }

    /* 5. Bottom 2x2 Telemetry Grid (Temp, Humidity, Wind, Sunset) */
    .telemetry-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-gap: 5px 8px;
      padding: 1px 1px 0;
    }
    .telemetry-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .item-icon {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .item-text {
      display: flex;
      flex-direction: column;
      line-height: 1.15;
    }
    .item-label {
      font-size: 8px;
      font-weight: 600;
      letter-spacing: 0.02em;
    }
    .item-val {
      font-size: 11.5px;
      font-weight: 700;
      font-feature-settings: "tnum";
    }

    /* Color scheme matching reference */
    .item-temp .item-label { color: #f97316; }
    .item-temp .item-val   { color: #fde047; }
    
    .item-hum .item-label  { color: #38bdf8; }
    .item-hum .item-val    { color: #7dd3fc; }

    .item-wind .item-label { color: #c084fc; }
    .item-wind .item-val   { color: #e9d5ff; }

    .item-sun .item-label  { color: #fb923c; }
    .item-sun .item-val    { color: #fef08a; }

    .caption {
      font-size: 12px;
      color: #94a3b8;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div class="preview-card">
    <div class="device-bezel">
      <div class="screen-canvas">
        
        <!-- 1. Header: City + Status -->
        <div class="header-row">
          <div class="header-city">Dhaka</div>
          <div class="header-status">
            <span class="status-dot"></span>
            <span class="status-text">Online</span>
          </div>
        </div>

        <!-- 2. Hero Weather Icon + Live Time & Date -->
        <div class="hero-row">
          <!-- Weather Graphic: Sun + Cloud -->
          <div class="hero-weather-icon">
            <svg viewBox="0 0 76 64" width="62" height="48" fill="none">
              <circle cx="28" cy="24" r="13" fill="#f59e0b"/>
              <g stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round">
                <line x1="28" y1="4" x2="28" y2="7"/>
                <line x1="28" y1="41" x2="28" y2="44"/>
                <line x1="14" y1="24" x2="11" y2="24"/>
                <line x1="45" y1="24" x2="42" y2="24"/>
                <line x1="18.1" y1="14.1" x2="16" y2="12"/>
                <line x1="39.9" y1="35.9" x2="37.8" y2="33.8"/>
                <line x1="18.1" y1="33.8" x2="16" y2="35.9"/>
                <line x1="39.9" y1="12" x2="37.8" y2="14.1"/>
              </g>
              <path d="M22 48h36a12 12 0 0 0 2-23.8 17 17 0 0 0-31-4 13 13 0 0 0-7 27.8z" fill="#bae6fd" opacity="0.95"/>
              <path d="M20 48h38a10 10 0 0 0 0-20c-.5 0-1 .05-1.5.15A14 14 0 0 0 29 20a13.9 13.9 0 0 0-11 5.4A11 11 0 0 0 20 48z" fill="#e0f2fe"/>
            </svg>
          </div>

          <!-- Time, Date, Day -->
          <div class="hero-time-col">
            <div class="time-digits">21:44</div>
            <div class="date-row">
              <span class="date-str">24 Oct</span>
              <span class="day-str">Fri</span>
            </div>
          </div>
        </div>

        <!-- 3. Islamic Prayer Times: 5-Waqt Bento Grid Strip -->
        <div class="prayer-strip-container">
          <div class="prayer-strip-header">
            <span>Salah Times (Dhaka)</span>
            <span>Next: Isha</span>
          </div>
          <div class="prayer-grid">
            <div class="prayer-cell">
              <span class="prayer-name">Fajr</span>
              <span class="prayer-time">04:43</span>
            </div>
            <div class="prayer-cell">
              <span class="prayer-name">Dhuhr</span>
              <span class="prayer-time">11:43</span>
            </div>
            <div class="prayer-cell">
              <span class="prayer-name">Asr</span>
              <span class="prayer-time">15:01</span>
            </div>
            <div class="prayer-cell">
              <span class="prayer-name">Maghrib</span>
              <span class="prayer-time">17:27</span>
            </div>
            <div class="prayer-cell is-next">
              <span class="prayer-name">Isha</span>
              <span class="prayer-time">18:43</span>
            </div>
          </div>
        </div>

        <!-- 4. Weather Condition Banner -->
        <div class="condition-banner">
          <span class="condition-text">Broken clouds</span>
          <span class="condition-temp">28°C</span>
        </div>

        <!-- 5. 2x2 Telemetry Grid (Temp, Humidity, Wind, Sunset) -->
        <div class="telemetry-grid">
          
          <div class="telemetry-item item-temp">
            <div class="item-icon">
              <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="#f97316" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M14 14.76V3.5a2.5 2.5 0 0 0-5 0v11.26a4.5 4.5 0 1 0 5 0z" fill="#ea580c" fill-opacity="0.3"></path>
                <circle cx="11.5" cy="17.5" r="2.5" fill="#f97316"></circle>
                <line x1="11.5" y1="9" x2="11.5" y2="15" stroke="#f97316" stroke-width="2"></line>
              </svg>
            </div>
            <div class="item-text">
              <span class="item-label">Temperature</span>
              <span class="item-val">28°C</span>
            </div>
          </div>

          <div class="telemetry-item item-hum">
            <div class="item-icon">
              <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z" fill="#0284c7" fill-opacity="0.3"></path>
                <circle cx="9" cy="15" r="1.5" fill="#38bdf8"></circle>
                <circle cx="15" cy="15" r="1.5" fill="#38bdf8"></circle>
              </svg>
            </div>
            <div class="item-text">
              <span class="item-label">Humidity</span>
              <span class="item-val">64%</span>
            </div>
          </div>

          <div class="telemetry-item item-wind">
            <div class="item-icon">
              <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="#c084fc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 21V3"></path>
                <path d="M4 4h14l-2 5 2 5H4" fill="#9333ea" fill-opacity="0.25"></path>
                <line x1="9" y1="4" x2="8" y2="14"></line>
                <line x1="14" y1="4" x2="13" y2="14"></line>
              </svg>
            </div>
            <div class="item-text">
              <span class="item-label">Wind</span>
              <span class="item-val">2.4 m/s S</span>
            </div>
          </div>

          <div class="telemetry-item item-sun">
            <div class="item-icon">
              <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="#fb923c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M17 18a5 5 0 0 0-10 0" fill="#f97316" fill-opacity="0.3"></path>
                <line x1="12" y1="9" x2="12" y2="2"></line>
                <line x1="4.22" y1="10.22" x2="5.64" y2="11.64"></line>
                <line x1="1" y1="18" x2="23" y2="18"></line>
                <polyline points="9 5 12 2 15 5"></polyline>
              </svg>
            </div>
            <div class="item-text">
              <span class="item-label">Sunset</span>
              <span class="item-val">17:27</span>
            </div>
          </div>

        </div>

      </div>
    </div>
    <div class="caption">SmallTV-Ultra: Weather + 5-Waqt Prayer Times (240×240 ST7789 IPS)</div>
  </div>
</body>
</html>
