services:
  smalltv-collector:
    build:
      context: .
      dockerfile: Dockerfile
    image: smalltv-collector:local
    restart: unless-stopped
    # The collector only reads provider data and pushes telemetry; it does not need writes.
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    environment:
      SMALLTV_IP: ${SMALLTV_IP:?Run setup_windows.ps1 or set SMALLTV_IP in .env}
      SMALLTV_PROVIDER_MODE: ${SMALLTV_PROVIDER_MODE:-auto}
      SMALLTV_PUSH_INTERVAL_SEC: ${SMALLTV_PUSH_INTERVAL_SEC:-10}
      SMALLTV_FRESHNESS_TIMEOUT_SEC: ${SMALLTV_FRESHNESS_TIMEOUT_SEC:-90}
      # Container-internal bind; the ports section keeps the host endpoint loopback-only.
      SMALLTV_BRIDGE_HOST: 0.0.0.0
      SMALLTV_BRIDGE_PORT: 4310
      SMALLTV_BRIDGE_TOKEN: ${SMALLTV_BRIDGE_TOKEN:?Run setup_windows.ps1 to generate a bridge token}
      SMALLTV_CODEX_HOME_DIR: /data/codex
      SMALLTV_GEMINI_BRAIN_DIR: /data/gemini/antigravity/brain
      SMALLTV_CLAUDE_HOME_DIR: /data/claude
    # Do not change 127.0.0.1 to 0.0.0.0 unless LAN clients should reach the bridge.
    ports:
      - "127.0.0.1:${BRIDGE_PORT:-4310}:4310"
